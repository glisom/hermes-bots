plugins:
  enabled: []
platform_toolsets:
  cli:
    - clarify
    - file
    - kanban
    - terminal
    - web
kanban:
  dispatch_in_gateway: true
  notify_in_gateway: true
  review_dispatch: true
  auto_decompose: false
  orchestrator_profile: ll-em
  default_assignee: ll-backend
  max_in_progress_per_profile: 1
  dispatch_profiles:
    - ll-em
    - ll-backend
    - ll-frontend
    - ll-qa
approvals:
  mode: smart
  single_query_mode: deny
  deny:
    - "git push *--force*"
    - "git push -f*"
    - "gh pr merge*"
